name: Build and Push Container Images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }} for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            arch: amd64
            platform: linux/amd64
          - variant: runtime
            arch: arm64
            platform: linux/arm64
          - variant: runtime
            arch: armv7
            platform: linux/arm/v7
          - variant: web-runtime
            arch: amd64
            platform: linux/amd64
          - variant: web-runtime
            arch: arm64
            platform: linux/arm64
          - variant: web-runtime
            arch: armv7
            platform: linux/arm/v7
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=cups-web-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=cups-web-${{ matrix.variant }}-${{ matrix.arch }},mode=max

  manifest:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifests
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          for variant in runtime web-runtime; do
            if [ "$variant" = "runtime" ]; then
              suffix=""
            else
              suffix="-web"
            fi
            sources=""
            for arch in amd64 arm64 armv7; do
              sources="$sources $IMAGE_NAME:build-$GITHUB_SHA-$variant-$arch"
            done
            tags="-t $IMAGE_NAME:$VERSION$suffix"
            if [ "$IS_RELEASE" = "true" ]; then
              tags="$tags -t $IMAGE_NAME:latest$suffix"
            else
              tags="$tags -t $IMAGE_NAME:sha-$short_sha$suffix"
            fi
            docker buildx imagetools create $tags $sources
          done
